/* VOICE: club noticeboard, calm and exact
   IDEA: a tournament leaderboard — header band over a course photo, tabs, scorecard tables
   PICTURE: the Ranking table itself, counted cards in ink, discarded ones struck through
   COLOUR and TYPE: fairway green band, flag-yellow accent; Barlow Condensed + Public Sans

  --bg:#F2F5F1; --surface:#FFFFFF; --ink:#16231B; --muted:#5E6B62; --line:#D6DED7;
  --green:#1D5C3E; --green-soft:#E3EEE6; --flag:#D8A21E; --flag-ink:#3A2A00; --danger:#B3402F;
  --band:#173F2C; --band-ink:#F1F5EF;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1612; --surface:#17211B; --ink:#E5ECE6; --muted:#97A59B; --line:#2B3830;
  --green:#6FC496; --green-soft:#1F3328; --flag:#E9B83A; --flag-ink:#2A1E00; --danger:#E07A66;
  --band:#0B2418; --band-ink:#E5ECE6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#17211B; --ink:#E5ECE6; --muted:#97A59B; --line:#2B3830;

  --band:#0B2418; --band-ink:#E5ECE6; color-scheme:dark}

header.band h1,header.band .sub,header.band .eyebrow{text-shadow:0 1px 3px rgba(0,0,0,.55)}
header.band nav.tabs{background:color-mix(in srgb,var(--band) 55%,transparent);margin-inline:-10px;padding-inline:6px;border-radius:8px 8px 0 0}
header.band .wrap{padding-block:40px 0;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--flag)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,52px);line-height:1;margin:4px 0 0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.sub{color:color-mix(in srgb,var(--band-ink) 72%,transparent);margin:6px 0 0;font-size:14px}
.highlights{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:color-mix(in srgb,var(--band-ink) 18%,transparent);border-radius:8px;overflow:hidden}
.hl{background:color-mix(in srgb,var(--band) 72%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:12px 14px;min-width:0}
.hl .k{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:color-mix(in srgb,var(--band-ink) 65%,transparent)}
.hl .v{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl .n{font-family:var(--display);font-size:26px;font-weight:700;color:var(--flag);line-height:1.1;font-variant-numeric:tabular-nums}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:none;border:0;color:color-mix(in srgb,var(--band-ink) 70%,transparent);padding:10px 14px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--band-ink);border-bottom-color:var(--flag)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
main .wrap{padding-block:24px 48px;display:flex;flex-direction:column;gap:22px}
.notice{background:color-mix(in srgb,var(--flag) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--flag) 45%,transparent);border-radius:8px;padding:10px 14px;font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
h2{font-family:var(--display);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.1}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px;margin:0}
.board{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);text-align:right;padding:10px 10px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
th.l,td.l{text-align:left}
td.pos{font-family:var(--display);font-weight:700;font-size:18px;width:44px;text-align:left;color:var(--muted)}
tr.top td.pos{color:var(--green)}
td.total{font-family:var(--display);font-weight:700;font-size:20px;color:var(--ink)}
.sticky{position:sticky;left:0;background:var(--surface);z-index:1}
.sticky2{position:sticky;left:44px;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--line)}
th.rd{font-size:12px;letter-spacing:.04em}
td.rd{color:var(--ink);min-width:44px}
td.rd.miss{color:var(--line)}
td.rd.best{font-weight:700;color:var(--green)}
td.rd small.stb{display:block;font-size:11px;font-weight:400;color:var(--muted);line-height:1.1}
.name{font-weight:600}
.logo{width:22px;height:22px;object-fit:contain;flex:none;display:block}
.chip.solid .logo{width:26px;height:26px;margin:-3px 0 -3px -5px}
.team h3 .logo{width:52px;height:52px}
legend .logo{width:24px;height:24px}
.crests{display:flex;gap:10px;flex-wrap:wrap}
.crests img{width:clamp(48px,10vw,68px);height:clamp(48px,10vw,68px);object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.cap{display:inline-block;margin-left:6px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.06em;line-height:1;padding:2px 5px 1px;border-radius:4px;background:var(--flag);color:var(--flag-ink);vertical-align:2px}
tr.mid td{background:color-mix(in srgb,var(--flag) 16%,var(--surface))}
.prize{background:var(--surface);border:1px solid color-mix(in srgb,var(--flag) 55%,var(--line));border-radius:10px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.prize .k{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--flag-ink);background:var(--flag);padding:2px 8px;border-radius:4px}
.prize .w{font-weight:600}
.guest-row{display:flex;gap:8px;align-items:center}
.guest-row input[type=text]{flex:1;min-width:0}
.guest-row input[type=number]{width:64px}
svg .slice:hover{opacity:.82}
.hcv{display:inline-block;padding:1px 6px;border-radius:4px;font-variant-numeric:tabular-nums}
.hc-better{background:color-mix(in srgb,var(--green) 24%,transparent);color:var(--ink)}
.hc-worse{background:color-mix(in srgb,var(--danger) 22%,transparent);color:var(--ink)}
input.hc-better{background:color-mix(in srgb,var(--green) 24%,var(--bg))}
input.hc-worse{background:color-mix(in srgb,var(--danger) 22%,var(--bg))}
td.rd.short{color:var(--muted);font-style:italic}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,var(--muted))}
.chip.solid{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--ink);padding:2px 9px;border-radius:999px;font-weight:500}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.team{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.team h3{margin:0;font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.team .tt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--green)}
.team ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.team li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.team li span:last-child{color:var(--muted)}
.team li.mrow{display:grid;grid-template-columns:minmax(0,118px) 52px 1fr auto;align-items:center;column-gap:6px}
.team li.mrow .mn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.team li.mrow .mp{text-align:right}
.rounds{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.rounds button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;text-align:left;font-family:var(--body)}
.rounds button .d{font-family:var(--display);font-weight:700;font-size:17px;display:block;line-height:1.1}
.rounds button .c{font-size:12px;color:var(--muted)}
.rounds button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--bg)}
.rounds button[aria-pressed="true"] .c{color:color-mix(in srgb,var(--bg) 80%,transparent)}
.two{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px;align-items:start}
.absent{color:var(--muted);font-size:14px}
.btn{font-family:var(--body);font-weight:600;font-size:14px;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--bg)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input,select{font-family:var(--body);font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input[type=number]{width:72px;text-align:right;font-variant-numeric:tabular-nums}
.entry{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.entry fieldset{border:1px solid var(--line);border-radius:8px;margin:0;padding:8px 12px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.entry legend{padding:0 6px;font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:14px;display:flex;align-items:center;gap:6px}
.entry .p{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.entry .pair{display:flex;gap:6px;flex:none}
.entry .pair input{width:64px}
.entry .p.hint .pair span{width:64px;text-align:center;font-size:12px}
.entry .p>span:first-child{min-width:0;line-height:1.25}
.list{display:flex;flex-direction:column}
.list .it{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.list .it:first-child{border-top:0}
.list .it .grow{flex:1;min-width:140px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.status{font-size:14px;min-height:1.4em}

@media (max-width:600px){.brand{flex-direction:column-reverse;align-items:flex-start}.club-logo{width:150px}}
@media (max-width:720px){.two{grid-template-columns:1fr}.highlights{grid-template-columns:1fr}.hl{display:flex;align-items:baseline;gap:10px}.hl .k{flex:none;width:100px;white-space:normal;line-height:1.2}.hl .v{flex:1}.hl .n{font-size:20px}}
@media (prefers-reduced-motion:no-preference){.board,.team,.panel{animation:rise .25s ease-out both}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}
td.rd.drop{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px;opacity:.75}
.pgrid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0 22px}
.pair select{padding:6px 4px}
.pgrid .p{padding:4px 0;border-bottom:1px solid var(--line)}
.pgrid .p input{width:64px}
.newp{border:1px solid var(--line);border-radius:8px;margin:0;padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.newp legend{padding:0 6px;font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:14px}
.np-row input.n-name{flex:1}

<script id="app-script">
(function(){
"use strict";
var S = JSON.parse(document.getElementById("league-data").textContent);
var ui = {tab:"ranking", cat:1, find:"", round:null, year:null, canEdit:false, editId:null, confirm:null, status:"", statusKind:"", busy:false, q:""};
try{ var t = localStorage.getItem("ranking-tab"); if(t) ui.tab = t; var c0 = Number(localStorage.getItem("ranking-cat")); if(c0===1||c0===2) ui.cat = c0; }catch(e){}
if(location.hash && /^#(ranking|torneos|gestionar)$/.test(location.hash)) ui.tab = location.hash.slice(1);

var MOIS = ["ene.","feb.","mar.","abr.","may.","jun.","jul.","ago.","sept.","oct.","nov.","dic."];
var DIAS = ["dom.","lun.","mar.","mié.","jue.","vie.","sáb."];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pd(d){var p=d.split("-");return {y:+p[0],m:+p[1]-1,d:+p[2]};}
function shortDate(d){var x=pd(d);return x.d+"/"+String(x.m+1).padStart(2,"0");}
function todayIso(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function longDate(d){var x=pd(d),w=new Date(x.y,x.m,x.d).getDay();return DIAS[w]+" "+x.d+" "+MOIS[x.m]+" "+x.y;}
function player(id){for(var i=0;i<S.players.length;i++) if(S.players[i].id===id) return S.players[i]; return null;}
function byLicence(lic){lic=String(lic||"").trim().toUpperCase(); if(!lic) return null; for(var i=0;i<S.players.length;i++) if(String(S.players[i].lic||"").toUpperCase()===lic) return S.players[i]; return null;}
function f1(n){return (Math.round(n*10)/10).toFixed(1).replace(".",",");}
function nBest(){return Math.max(1,Number(S.best)||16);}
function yearOf(r){return +r.date.slice(0,4);}
/* One season (S.season, e.g. "Temporada 2026–2027"): every registered tournament belongs to it */
function season(){return S.season||"Temporada";}
function years(){return [0];}
function rounds(y){return S.tournaments.slice().sort(function(a,b){return a.date<b.date?-1:1;});}
function hcOf(p){var v=p&&Number(p.hc);return p&&p.hc!==""&&p.hc!=null&&isFinite(v)?v:99;}
/* Handicap trend since the previous update: lower index = better (green), higher = worse (red) */
function hcTrend(p){if(!p||p.hcPrev==null||p.hc==null) return ''; var a=Number(p.hc),b=Number(p.hcPrev); if(!isFinite(a)||!isFinite(b)||a===b) return ''; return a<b?'hc-better':'hc-worse';}
function hcTitle(p){var t=hcTrend(p); return t?' title="Antes: '+f1(Number(p.hcPrev))+(t==='hc-better'?' (mejora)':' (empeora)')+'"':'';}
/* Categories: GolfDirecto assigns each player a category per tournament (1ª = handicap up to 18 included, 2ª = above).
   That category is stored with the result (r.cat); without it, the player's current handicap decides. */
var CATS=[1,2];
function catLimit(){var v=Number(S.catLimit);return isFinite(v)&&S.catLimit!==""&&S.catLimit!=null?v:18;}
function catName(c){return c===1?"1ª categoría":"2ª categoría";}
function ruleCat(p){var h=hcOf(p);return h<99&&h<=catLimit()?1:2;}
function catOf(r,pid){var c=r.cat&&r.cat[pid];return c===1||c===2?c:ruleCat(player(pid));}
/* A player's Ranking category = the category of his first tournament of the season (all his results count there) */
function playerCat(pid,rs){for(var i=0;i<rs.length;i++) if(typeof rs[i].scores[pid]==="number") return catOf(rs[i],pid); return ruleCat(player(pid));}
/* Quick player search: accents and case ignored; rows carry data-find with the normalised name */
function norm(x){return String(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();}
function findBox(){return '<div class="findbar"><input type="search" class="find" id="find" value="'+esc(ui.find)+'" placeholder="Buscar jugador…" aria-label="Buscar jugador" autocomplete="off"><span class="hint" id="find-info" aria-live="polite"></span></div>';}
function applyFind(){
  var q=norm(ui.find), rows=document.querySelectorAll("tr[data-find]"), n=0;
  rows.forEach(function(tr){var ok=!q||tr.dataset.find.indexOf(q)>=0; tr.hidden=!ok; if(ok) n++;});
  var info=document.getElementById("find-info"); if(!info) return;
  if(!q){info.innerHTML="";return;}
  var h=n?n+' jugador'+(n!==1?'es':''):'Nadie con ese nombre aquí';
  if(ui.tab==="ranking"&&ui.LC){var oc=ui.cat===1?2:1, other=ui.LC[oc].filter(function(x){return norm(x.name).indexOf(q)>=0;});
    if(other.length) h+=' · en '+catName(oc)+': '+other.slice(0,5).map(function(x){return '<button class="linkbtn" data-cat="'+oc+'">'+esc(x.name)+'</button>';}).join(', ')+(other.length>5?'…':'');}
  info.innerHTML=h;
  document.querySelectorAll(".board").forEach(function(bd){var t=bd.querySelector("tbody"); if(!t||!t.querySelector("tr[data-find]")) return; var vis=t.querySelector("tr[data-find]:not([hidden])"); bd.hidden=!!q&&!vis; var prev=bd.previousElementSibling; if(prev&&prev.classList.contains("prize")) prev.hidden=bd.hidden;});
}
function hcCell(p){var hv=hcOf(p);return '<span class="hcv '+hcTrend(p)+'"'+hcTitle(p)+'>'+(hv<99?f1(hv):'–')+'</span>';}

/* Golf leaderboard ranking: equal totals share a position, shown as T3 */
function rank(rows,key){
  rows.sort(function(a,b){return b[key]-a[key] || a.name.localeCompare(b.name,"es");});
  var n=rows.length;
  rows.forEach(function(r,i){
    var first=i; while(first>0 && rows[first-1][key]===r[key]) first--;
    var tied=(i>0&&rows[i-1][key]===r[key])||(i<n-1&&rows[i+1][key]===r[key]);
    r.pos=first+1; r.posLabel=(tied?"T":"")+(first+1);
  });
  return rows;
}
/* Results of one tournament, best Stableford first */
function dayRows(r,cat){
  return rank(Object.keys(r.scores).filter(function(k){return !cat||catOf(r,k)===cat;}).map(function(k){var p=player(k);return {id:k,name:p?p.name:"(jugador eliminado)",pts:r.scores[k]};}),"pts");
}
/* The Ranking of a year: each player's N best Stableford results of that year add up (N = 16).
   With fewer than N results, all of them count. Equal scores at the cut: the earlier tournament counts (same total either way). */
function ranking(y,cat){
  var rs=rounds(y), N=nBest(), win={};
  rs.forEach(function(r){for(var k in r.scores){var w=r.id+"|"+catOf(r,k); if(win[w]==null||r.scores[k]>win[w]) win[w]=r.scores[k];}});
  var rows=S.players.map(function(p){
    var res=[]; rs.forEach(function(r){var v=r.scores[p.id]; if(typeof v==="number") res.push({rid:r.id,date:r.date,s:v});});
    var srt=res.slice().sort(function(a,b){return b.s-a.s||(a.date<b.date?-1:1);});
    var used={}, total=0; srt.slice(0,N).forEach(function(x){used[x.rid]=1;total+=x.s;});
    var all=res.reduce(function(a,x){return a+x.s;},0);
    var cut=res.length>=N?srt[N-1].s:null;
    var per={}; res.forEach(function(x){var r=rs.filter(function(q){return q.id===x.rid;})[0]; per[x.rid]={s:x.s,used:!!used[x.rid],win:x.s===win[x.rid+"|"+catOf(r,p.id)],cat:catOf(r,p.id)};});
    return {id:p.id,name:p.name,total:total,all:all,played:res.length,avg:res.length?all/res.length:0,cut:cut,dropped:Math.max(0,res.length-N),per:per};
  }).filter(function(x){return x.played&&(!cat||playerCat(x.id,rs)===cat);});
  return rank(rows,"total");
}

function render(){
  var ys=years();
  if(ui.year==null||ys.indexOf(ui.year)<0) ui.year=ys[ys.length-1];
  var Y=ui.year, rs=rounds(Y);
  if(!ui.round || !rs.some(function(r){return r.id===ui.round;})) ui.round = rs.length?rs[rs.length-1].id:null;
  var LC={1:ranking(Y,1),2:ranking(Y,2)}, last=rs[rs.length-1]; ui.LC=LC;
  var nPl=LC[1].length+LC[2].length;
  function lead(c){var L=LC[c],x=L[0];return '<div class="hl"><div class="k">Líder '+(c===1?'1ª':'2ª')+' cat.</div><div class="v">'+(x?esc(x.name)+(L[1]&&L[1].total===x.total?' (empatado)':''):'—')+'</div><div class="n">'+(x?x.total+' pts':'')+'</div></div>';}
  var lastW=last?CATS.map(function(c){return dayRows(last,c).filter(function(x){return x.pos===1;});}):[[],[]];
  var tabs=[["ranking","Ranking"],["torneos","Torneos"]];
  if(ui.canEdit) tabs.push(["gestionar","Gestionar"]);
  if(ui.tab==="gestionar"&&!ui.canEdit) ui.tab="ranking";
  var h='';
  h+='<header class="band"><div class="wrap"><div class="brand"><div><div class="eyebrow">'+esc(season())+' · Stableford · '+nBest()+' mejores resultados</div><h1>'+esc(S.title||"Ranking")+'</h1>';
  h+='<p class="sub">'+(S.club?esc(S.club)+' · ':'')+nPl+' jugador'+(nPl!==1?'es':'')+' · '+rs.length+' torneo'+(rs.length!==1?'s':'')+' jugado'+(rs.length!==1?'s':'')+(last?' · último: '+esc(longDate(last.date)):'')+'</p></div><div class="club-logo" role="img" aria-label="Real Club de Golf Las Rozas de Madrid"></div></div>';
  h+='<div class="highlights">';
  h+=lead(1)+lead(2);
  CATS.forEach(function(c){var g=lastW[c-1]||[];h+='<div class="hl"><div class="k">Último ganador '+(c===1?'1ª':'2ª')+' cat.</div><div class="v" title="'+esc(g.map(function(x){return x.name;}).join(', '))+'">'+(g.length?g.map(function(x){return esc(x.name);}).join(', '):'—')+'</div><div class="n">'+(g.length?g[0].pts+' pts':'')+'</div></div>';});
  h+='</div>';
  h+='<nav class="tabs" role="tablist">'+tabs.map(function(t){return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(ui.tab===t[0])+'">'+t[1]+'</button>';}).join('')+'</nav>';
  h+='</div></header><main><div class="wrap">';
  if(ui.tab==="ranking") h+=yearSwitch(ys)+catSwitch(LC)+(rs.length?findBox():'')+viewRanking(LC[ui.cat],rs);
  else if(ui.tab==="torneos") h+=yearSwitch(ys)+viewTorneos(rs,LC);
  else h+=viewGestionar();
  h+='</div></main><footer><strong>Actualizado el 15/11/2026</strong> · Dos categorías: 1ª hasta hándicap '+String(catLimit()).replace('.',',')+' incluido, 2ª por encima (la que asigna GolfDirecto en cada torneo); cada jugador figura en la categoría de su primer torneo de la temporada · Ranking = suma de los '+nBest()+' mejores resultados Stableford de cada jugador en la temporada (si ha jugado menos torneos, cuentan todos) · los resultados tachados no cuentan · Corte = peor resultado que todavía cuenta: un torneo por encima lo mejora · empates en el ranking: misma posición (T)</footer>';
  document.getElementById("app").innerHTML=h;
  var f=document.getElementById("rd-date"); if(f&&!f.value&&!ui.editId) f.value=todayIso();
  applyFilter(); applyFind();
}
function yearSwitch(ys){
  if(ys.length<2) return '';
  return '<div class="rounds" role="group" aria-label="Temporada">'+ys.slice().reverse().map(function(y){var n=rounds(y).length;return '<button data-year="'+y+'" aria-pressed="'+(ui.year===y)+'"><span class="d">'+y+'</span><span class="c">'+n+' torneo'+(n!==1?'s':'')+'</span></button>';}).join('')+'</div>';
}
function catSwitch(LC){
  return '<div class="rounds" role="group" aria-label="Categoría">'+CATS.map(function(c){var n=LC[c].length;return '<button data-cat="'+c+'" aria-pressed="'+(ui.cat===c)+'"><span class="d">'+catName(c)+'</span><span class="c">'+(c===1?'HC ≤ ':'HC > ')+String(catLimit()).replace('.',',')+' · '+n+' jugador'+(n!==1?'es':'')+'</span></button>';}).join('')+'</div>';

var HB="host:claude_browser", RFEG="https://rfegolf.es/consulta-handicap/";
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function txt(res){try{return (res.content||[]).filter(function(c){return c.type==="text";}).map(function(c){return c.text;}).join("\n")||(typeof res.payload==="string"?res.payload:JSON.stringify(res.payload||""));}catch(e){return "";}}
function hcError(e){
  var c=e&&e.code;
  if(c==="server_not_connected") return "El navegador de la aplicación Claude no está disponible aquí. Abre esta página en la aplicación de escritorio de Claude e inténtalo de nuevo.";
  if(c==="not_in_manifest"||c==="approval_required"||c==="not_granted") return "No se ha autorizado a esta página a usar el navegador de la aplicación Claude.";
  if(c==="cancelled") return "Has cancelado una acción del navegador. No se ha cambiado nada.";
  if(c==="capability_disabled"||c==="capability_removed") return "Esta vista no permite usar el navegador. Abre la página en la aplicación de escritorio de Claude.";
  return "Error del navegador ("+(c||"desconocido")+"): "+((e&&e.message)||"");

/* Browser calls are spaced out and retried when the app asks to slow down (rate_limited) */
function browser(mcp,st){
  var last=0;
  return async function call(tool,args){
    for(var r=0;;r++){
      var wait=last+1500-Date.now(); if(wait>0) await sleep(wait);
      try{var out=await mcp.callTool(HB,tool,args); last=Date.now(); return out;}
      catch(e){last=Date.now(); if(e&&e.code==="rate_limited"&&r<8){var ms=Math.max(Number(e.retryAfterMs)||0,3000*(r+1)); st.msg="Esperando al navegador ("+Math.round(ms/1000)+" s)…"; render(); await sleep(ms); continue;} throw e;}
    }
  };
}
function parseHc(text,lic){
  var i=text.toUpperCase().indexOf(lic.toUpperCase()); if(i<0) return null;
  var m=/HCP actualizado:[^\n]*\n\s*(\+?-?\d+(?:[.,]\d+)?)/.exec(text.slice(i));
  if(!m) return null; var s=m[1].replace(",","."); return s.charAt(0)==="+"?-Number(s.slice(1)):Number(s);
}

function titleCase(s){return String(s||"").toLowerCase().replace(/(^|[\s\-])(\S)/g,function(m,a,b){return a+b.toUpperCase();});}
function gdShort(pl){var f=String(pl.firstName||"").trim().split(/\s+/)[0]||"", s=String(pl.surname||"").trim().split(/\s+/)[0]||""; return titleCase((f+" "+s).trim());}
function gdJson(res){var t=txt(res), i=t.indexOf("\n---\n"); if(i>=0) t=t.slice(i+5); var a=t.indexOf("{"), b=t.lastIndexOf("}"); if(a<0||b<a) throw {code:"tool_error",message:"respuesta de GolfDirecto ilegible"}; return JSON.parse(t.slice(a,b+1));}
async function gdImport(){
  if(ui.gd&&ui.gd.running) return;
  var inp=document.getElementById("gd-url"), url=inp?inp.value.trim():"";
  var m=/game\/([a-f0-9]{24})/i.exec(url)||/^([a-f0-9]{24})$/i.exec(url);
  if(!m){ui.gd={url:url,err:"Pega el enlace de un torneo de GolfDirecto (…golfdirecto.com/game/…)."};render();return;}
  var gid=m[1].toLowerCase();
  ui.gd={url:url,running:true,msg:"Abriendo GolfDirecto…"}; render();
  try{
    var mcp=window.claude&&window.claude.use?await window.claude.use("mcp"):null;
    if(!mcp) throw {code:"capability_disabled"};
    var call=browser(mcp,ui.gd);
    async function getJson(u){
      var o=txt(await call("preview_start",{url:u})); var tm=/tabId\s+([^\s)]+)/.exec(o), base=tm?{tabId:tm[1]}:{};
      var j=null;
      for(var a=0;a<4&&!j;a++){await sleep(1500); try{j=gdJson(await call("get_page_text",Object.assign({max_chars:600000},base)));}catch(e){if(a===3) throw e;}}
      return j;
    }
    var API="https://www.golfdirecto.com/api/v2/public/";
    var g=await getJson(API+"game/"+gid+"/active"); g=g&&g.data;
    if(!g) throw {code:"tool_error",message:"torneo no encontrado"};
    var dt=new Date(g.scheduleStartDate), date=isNaN(dt)?"":dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
    var cats=g.categories||[], entries=[];
    for(var c=0;c<cats.length;c++){
      ui.gd.msg="Leyendo "+(cats[c].name||"categoría "+(c+1))+"…"; render();
      var rj=await getJson(API+"score/ranking/entry?game="+gid+"&category="+cats[c]._id);
      var cn=String(cats[c].name||""), ck=/2/.test(cn)?2:/1/.test(cn)?1:(c===0?1:2); (rj&&rj.data||[]).forEach(function(e){e._cat=ck; entries.push(e);});
    }
    var members=[], others=[], unfinished=[], seen={};
    entries.forEach(function(e){
      var pl=e.player||{}, d=(e.view&&e.view.day)||{}, net=d.onlyNet;
      var lic=String(pl.license||"").trim().toUpperCase();
      var key=lic||String(pl._id||(pl.firstName+' '+pl.surname)).toUpperCase(); if(seen[key]) return; seen[key]=1;
      var p=byLicence(lic), full=titleCase((pl.firstName||"")+" "+(pl.surname||"")).trim();
      if(!(typeof net==="number"&&e.playedTotal>=18)){ unfinished.push(p?p.name:full); return; }
      if(p) members.push({id:p.id,name:p.name,net:net,cat:e._cat});
      else others.push({name:gdShort(pl),full:full,lic:lic,net:net,cat:e._cat,pick:true});
    });
    others.sort(function(a,b){return b.net-a.net||a.full.localeCompare(b.full);});
    ui.gd={url:url,running:false,title:g.name||"",date:date,members:members,others:others,unfinished:unfinished};
    render();
  }catch(e){ui.gd={url:url,running:false,err:hcError(e)};render();}
}

  var h='<div class="status '+ui.statusKind+'" role="status">'+esc(ui.status)+'</div>';

  h+='<form class="panel" id="f-round"><div class="section-head"><h2>'+(real?'Modificar el torneo del '+esc(shortDate(real.date)):'Registrar un torneo')+(ui.pre?' · importado de GolfDirecto':'')+'</h2><p class="hint">Puntos Stableford y categoría de cada jugador (por defecto, según su hándicap: 1ª hasta '+String(catLimit()).replace('.',',')+') · deja vacío a quien no jugó</p></div>';
  h+='<div class="row"><label class="f" for="rd-date">Fecha<input type="date" id="rd-date" required value="'+(ed?ed.date:'')+'"></label><label class="f" for="rd-name" style="flex:1;min-width:180px">Nombre del torneo (opcional)<input type="text" id="rd-name" value="'+esc(ed?ed.name:'')+'" placeholder="p. ej. Medal de noviembre"></label></div>';
  if(S.players.length){
    var filled=ed?Object.keys(ed.scores).length:0;
    h+='<div class="row"><label class="f" for="p-filter" style="flex:1;min-width:200px">Buscar jugador<input type="search" id="p-filter" value="'+esc(ui.q)+'" placeholder="Nombre o licencia"></label><span class="hint">'+S.players.length+' jugadores'+(filled?' · '+filled+' con resultado':'')+'</span></div>';
    h+='<div class="entry pgrid">';
    sorted().forEach(function(p){
      var v=ed&&typeof ed.scores[p.id]==="number"?ed.scores[p.id]:"";
      var cv=ed&&ed.cat&&(ed.cat[p.id]===1||ed.cat[p.id]===2)?ed.cat[p.id]:ruleCat(p);
      h+='<div class="p" data-row="'+esc((p.name+" "+(p.lic||"")).toLowerCase())+'"><span>'+esc(p.name)+'</span><span class="pair"><input type="number" inputmode="numeric" min="0" max="72" id="sc-'+p.id+'" data-pid="'+p.id+'" value="'+v+'" aria-label="Stableford de '+esc(p.name)+'">'+catSel('ct-'+p.id,'p-cat',cv)+'</span></div>';
    });
    h+='</div>';
  }
  var nps=ed&&ed.newPlayers&&ed.newPlayers.length?ed.newPlayers:[{}];
  h+='<fieldset class="newp"><legend>Jugadores nuevos</legend><p class="hint" style="margin:0">Se añaden al Ranking al guardar. Con la licencia podrás consultar su hándicap y reconocerlo en GolfDirecto.</p><div id="new-rows" style="display:flex;flex-direction:column;gap:6px">'+nps.map(function(n){return newRow(n.name,n.lic,n.pts,n.cat);}).join('')+'</div><button type="button" class="btn small" data-act="add-new" style="align-self:flex-start">Añadir jugador</button></fieldset>';
  h+='<div class="row"><button class="btn primary" type="submit" '+(ui.busy?'disabled':'')+'>'+(real?'Guardar los cambios':'Guardar el torneo')+'</button>'+(real||ui.pre?'<button class="btn" type="button" data-act="cancel-edit">Cancelar</button>':'')+'</div></form>';

  var all=rounds(null);
  h+='<div class="panel"><h2>Torneos registrados</h2><div class="list">';
  if(!all.length) h+='<p class="hint">Todavía no hay torneos.</p>';
  all.slice().reverse().forEach(function(r){
    h+='<div class="it"><span class="grow"><strong>'+esc(longDate(r.date))+'</strong> · '+esc(r.name||'—')+' · '+Object.keys(r.scores).length+' tarjetas</span>';
    if(ui.confirm==="del:"+r.id) h+='<span class="confirm">¿Eliminar este torneo? <button class="btn small danger" data-act="del-yes" data-id="'+r.id+'">Eliminar</button><button class="btn small" data-act="no">Cancelar</button></span>';
    else h+='<button class="btn small" data-act="edit" data-id="'+r.id+'">Modificar</button><button class="btn small danger" data-act="del" data-id="'+r.id+'">Eliminar</button>';
    h+='</div>';
  });
  h+='</div></div>';

  h+=hcPanel();
  h+=ghPanel();
  h+='<form class="panel" id="f-roster"><div class="section-head"><h2>Ajustes y jugadores</h2><p class="hint">Cambia nombres, hándicaps o licencias, o añade un jugador, y luego guarda</p></div>';
  h+='<div class="row"><label class="f" for="s-season">Temporada<input type="text" id="s-season" value="'+esc(season())+'"></label><label class="f" for="s-title">Título<input type="text" id="s-title" value="'+esc(S.title||"Ranking")+'"></label><label class="f" for="s-club" style="flex:1;min-width:160px">Club<input type="text" id="s-club" value="'+esc(S.club||"")+'" placeholder="Nombre del club"></label><label class="f" for="s-best">Resultados que cuentan<input type="number" min="1" max="99" id="s-best" value="'+nBest()+'"></label><label class="f" for="s-cat">Límite 1ª cat. (HC ≤)<input type="number" step="0.1" min="-10" max="54" id="s-cat" value="'+catLimit()+'"></label><label class="f" for="s-gh">Repositorio GitHub<input type="text" id="s-gh" value="'+esc(S.ghRepo||"")+'" placeholder="usuario/repositorio" style="width:200px"></label></div>';
  h+='<div class="list">';
  sorted().forEach(function(p){
    h+='<div class="it"><input class="grow" type="text" id="pn-'+p.id+'" value="'+esc(p.name)+'" aria-label="Nombre del jugador"><input type="number" step="0.1" min="-10" max="54" class="'+hcTrend(p)+'"'+hcTitle(p)+' id="ph-'+p.id+'" value="'+(p.hc!=null?esc(p.hc):'')+'" aria-label="Handicap de '+esc(p.name)+'" placeholder="HC" title="Handicap" style="width:72px"><input type="text" id="pl-'+p.id+'" value="'+esc(p.lic||'')+'" aria-label="Licencia de '+esc(p.name)+'" placeholder="Licencia" title="Número de licencia RFEG" style="width:120px">';
    if(ui.confirm==="pdel:"+p.id) h+='<span class="confirm">¿Quitar? Se borrarán sus resultados. <button type="button" class="btn small danger" data-act="pdel-yes" data-id="'+p.id+'">Quitar</button><button type="button" class="btn small" data-act="no">Cancelar</button></span>';
    else h+='<button type="button" class="btn small danger" data-act="pdel" data-id="'+p.id+'">Quitar</button>';
    h+='</div>';
  });
  h+='</div><div class="row"><label class="f" for="new-player" style="flex:1;min-width:180px">Nuevo jugador<input type="text" id="new-player" placeholder="Nombre Apellido"></label><label class="f" for="new-lic">Licencia<input type="text" id="new-lic" placeholder="CM…" style="width:130px"></label></div>';
  h+='<div class="row"><button class="btn primary" type="submit" '+(ui.busy?'disabled':'')+'>Guardar ajustes y jugadores</button></div></form>';
  return h;
}

/* ---------- saving: the page republishes itself with the new data ---------- */
var FALLBACK_RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
var PAGE_TOP='<title>Ranking</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">\n';
function buildDoc(state){
  var reset=FALLBACK_RESET, hs=document.head?document.head.querySelectorAll("style"):[];
  for(var i=0;i<hs.length;i++){ if(hs[i].id!=="app-style"){ reset=hs[i].textContent; break; } }
  var json=JSON.stringify(state).replace(/</g,"\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
    +PAGE_TOP+'<style id="app-style">'+document.getElementById("app-style").textContent+'</style>\n<div id="app"></div>\n'
    +'<script type="application/json" id="league-data">'+json+'<\/script>\n'
    +'<script id="app-script">'+document.getElementById("app-script").textContent+'<\/script>\n</body></html>';
}
function setStatus(msg,kind){ui.status=msg;ui.statusKind=kind||"";render();}
async function save(next,okMsg){
  if(ui.busy) return;
  ui.busy=true; setStatus("Guardando…");
  try{
    var art=window.claude&&window.claude.use?await window.claude.use("artifact"):null;
    if(!art){ ui.busy=false; return setStatus("No se puede guardar desde esta vista. Abre la página en claude.ai.","err"); }
    await art.publish(buildDoc(next));
    S=next; ui.busy=false; ui.editId=null; ui.pre=null; ui.gd=null; ui.confirm=null; ui.q=""; setStatus(okMsg,"ok");
  }catch(e){
    ui.busy=false;
    var c=e&&e.code;
    if(c==="conflict") setStatus("Otra persona ha guardado al mismo tiempo; la página se recarga con su versión. Compruébalo y vuelve a introducir los datos si hace falta.","err");
    else if(c==="not_writer"||c==="not_granted") setStatus("No tienes permiso para modificar esta página. Solo sus editores pueden registrar resultados.","err");
    else setStatus("No se ha podido guardar ("+((e&&e.message)||c||"error desconocido")+"). Inténtalo de nuevo.","err");
  }
}
function clone(){return JSON.parse(JSON.stringify(S));}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function validPts(v){var n=Number(v);return v!==""&&isFinite(n)&&n>=0&&n<=72&&Math.round(n)===n;}

document.addEventListener("input",function(e){if(e.target.id==="p-filter"){ui.q=e.target.value;applyFilter();} if(e.target.id==="find"){ui.find=e.target.value;applyFind();}});
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-tab],[data-round],[data-year],[data-cat],[data-act]"); if(!b) return;
  if(b.dataset.tab){ui.tab=b.dataset.tab;ui.status="";try{localStorage.setItem("ranking-tab",ui.tab);}catch(x){}render();return;}
  if(b.dataset.round){ui.round=b.dataset.round;render();return;}
  if(b.dataset.cat){ui.cat=Number(b.dataset.cat);try{localStorage.setItem("ranking-cat",ui.cat);}catch(x){}render();return;}
  if(b.dataset.year){ui.year=Number(b.dataset.year);ui.round=null;render();return;}
  var a=b.dataset.act,id=b.dataset.id; e.preventDefault();
  if(a==="hc-run"){refreshHc();return;}
  if(a==="gh-export"){ghExport();return;}
  if(a==="gd-run"){gdImport();return;}
  if(a==="gd-fill"){
    var st=ui.gd; if(!st||!st.members) return;
    var sc={},ct={}; st.members.forEach(function(r){sc[r.id]=r.net; if(r.cat) ct[r.id]=r.cat;});
    var np=[]; st.others.forEach(function(o,i){var cb=document.querySelector('[data-gdi="'+i+'"]'), ni=document.getElementById("gdn-"+i); o.name=(ni&&ni.value.trim())||o.name; o.pick=!!(cb&&cb.checked); if(o.pick) np.push({name:o.name,lic:o.lic,pts:o.net,cat:o.cat});});
    var ex=S.tournaments.filter(function(x){return x.date===st.date;})[0]; ui.editId=ex?ex.id:null;
    ui.pre={date:st.date,name:ex&&ex.name?ex.name:st.title,scores:sc,cat:ct,newPlayers:np};
    ui.status=ex?"Ya había un torneo el "+shortDate(st.date)+": revisa los datos importados y guarda los cambios.":"Datos importados: revísalos y pulsa «Guardar el torneo».";ui.statusKind=""; ui.q="";
    render(); var f=document.getElementById("f-round"); if(f) f.scrollIntoView({behavior:"smooth"}); return;
  }
  if(a==="hc-apply"){var nh=clone(),m={};(ui.hc.res||[]).forEach(function(r){if(r.now!==null)m[r.id]=r.now;});nh.players.forEach(function(p){if(m[p.id]!=null&&Number(m[p.id])!==Number(p.hc)){p.hcPrev=p.hc; p.hc=m[p.id];} else delete p.hcPrev;}); nh.hcUpdated=todayIso();ui.hc=null;save(nh,"Hándicaps actualizados.");return;}
  if(a==="add-new"){var box=document.getElementById("new-rows");box.insertAdjacentHTML("beforeend",newRow());box.lastElementChild.querySelector("input").focus();return;}
  if(a==="rm-new"){var gr=b.closest(".np-row");if(gr)gr.remove();return;}
  if(a==="edit"){ui.editId=id;ui.pre=null;ui.confirm=null;ui.status="";render();window.scrollTo({top:0});}
  else if(a==="cancel-edit"){ui.editId=null;ui.pre=null;render();}
  else if(a==="del"){ui.confirm="del:"+id;render();}
  else if(a==="pdel"){ui.confirm="pdel:"+id;render();}
  else if(a==="no"){ui.confirm=null;render();}
  else if(a==="del-yes"){var n=clone();n.tournaments=n.tournaments.filter(function(r){return r.id!==id;});save(n,"Torneo eliminado.");}
  else if(a==="pdel-yes"){var n2=clone();n2.players=n2.players.filter(function(p){return p.id!==id;});n2.tournaments.forEach(function(r){delete r.scores[id];});save(n2,"Jugador eliminado.");}
});
document.addEventListener("submit",function(e){
  e.preventDefault();
  if(e.target.id==="f-round"){
    var date=document.getElementById("rd-date").value; if(!date) return setStatus("Indica la fecha del torneo.","err");
    var n=clone(), scores={}, cats={}, bad="";
    document.querySelectorAll("[data-pid]").forEach(function(i){var v=i.value.trim(); if(v==="") return; if(!validPts(v)) bad="El resultado de "+(player(i.dataset.pid)||{}).name+" no es válido (número entero de 0 a 72)."; else {scores[i.dataset.pid]=Number(v); var cs=document.getElementById("ct-"+i.dataset.pid); cats[i.dataset.pid]=cs&&cs.value==="1"?1:2;}});
    document.querySelectorAll("#new-rows .np-row").forEach(function(row){
      var nm=row.querySelector(".n-name").value.trim(), lic=row.querySelector(".n-lic").value.trim().toUpperCase(), v=row.querySelector(".n-pts").value.trim();
      if(!nm&&!lic&&!v) return;
      if(!nm) {bad="Falta el nombre de un jugador nuevo."; return;}
      if(v!==""&&!validPts(v)) {bad="El resultado de "+nm+" no es válido (número entero de 0 a 72)."; return;}
      var ex=lic?n.players.filter(function(p){return String(p.lic||"").toUpperCase()===lic;})[0]:null;
      if(!ex) ex=n.players.filter(function(p){return p.name.toLowerCase()===nm.toLowerCase();})[0];
      if(!ex){ex={id:uid("p"),name:nm}; if(lic) ex.lic=lic; n.players.push(ex);}
      if(v!==""){scores[ex.id]=Number(v); cats[ex.id]=row.querySelector(".n-cat").value==="1"?1:2;}
    });
    if(bad) return setStatus(bad,"err");
    if(!Object.keys(scores).length) return setStatus("Introduce al menos un resultado.","err");
    var name=document.getElementById("rd-name").value.trim();
    var dup=n.tournaments.filter(function(r){return r.date===date&&r.id!==ui.editId;})[0];
    if(dup) return setStatus("Ya existe un torneo en esa fecha. Modifícalo desde la lista de abajo.","err");
    if(ui.editId) n.tournaments.forEach(function(r){if(r.id===ui.editId){r.date=date;r.name=name;r.scores=scores;r.cat=cats;}});
    else n.tournaments.push({id:uid("r"),date:date,name:name,scores:scores,cat:cats});
    var wasEdit=!!ui.editId; ui.round=null; ui.year=+date.slice(0,4);
    save(n,wasEdit?"Torneo modificado.":"Torneo del "+shortDate(date)+" guardado.");
  } else if(e.target.id==="f-roster"){
    var m=clone();
    m.title=document.getElementById("s-title").value.trim()||"Ranking";
    m.season=document.getElementById("s-season").value.trim()||m.season;
    m.club=document.getElementById("s-club").value.trim();
    var bv=Number(document.getElementById("s-best").value); if(isFinite(bv)&&bv>=1&&Math.round(bv)===bv) m.best=bv;
    m.ghRepo=document.getElementById("s-gh").value.trim();
    var cl=document.getElementById("s-cat").value.trim(); if(cl!==""&&isFinite(Number(cl))) m.catLimit=Number(cl);
    m.players.forEach(function(p){var i=document.getElementById("pn-"+p.id); if(i&&i.value.trim()) p.name=i.value.trim(); var li=document.getElementById("pl-"+p.id); if(li){var lv=li.value.trim().toUpperCase(); if(lv) p.lic=lv; else delete p.lic;} var hi=document.getElementById("ph-"+p.id); if(hi){var hv=hi.value.trim(); if(hv==="") delete p.hc; else if(isFinite(Number(hv))&&Number(hv)!==Number(p.hc)){p.hcPrev=p.hc; p.hc=Number(hv); m.hcUpdated=todayIso();}}});
    var np=document.getElementById("new-player").value.trim(), nl=document.getElementById("new-lic").value.trim().toUpperCase();
    if(np){var o={id:uid("p"),name:np}; if(nl) o.lic=nl; m.players.push(o);}
    save(m,"Ajustes y jugadores guardados.");
  }
});

render();
(async function(){
  try{
    if(!window.claude||!window.claude.use) return;
    var u=await window.claude.use("user");
    ui.canEdit=false;
    if(ui.canEdit) render();
  }catch(e){}
})();
})();
</script>
